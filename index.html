<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS автомобиля</title>
</head>

<body style="font-family:Arial; font-size:24px; padding:30px;">

<h2>GPS автомобиля</h2>

<div id="status">Ожидание GPS...</div>

<br>

<div>
  Широта: <span id="lat">---</span>
</div>

<div>
  Долгота: <span id="lon">---</span>
</div>

<div>
  Скорость: <span id="speed">---</span> км/ч
</div>

<div>
  Точность: <span id="accuracy">---</span> м
</div>

<div>
  Последнее обновление:
  <span id="time">---</span>
</div>

<div>
  Участок:
  <span id="segment">---</span>
</div>


<script>

const FIREBASE_BASE =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com";

const LOCATION_URL =
  FIREBASE_BASE + "/location.json";

const HISTORY_BASE =
  FIREBASE_BASE + "/history";


/* ========================================
   НАСТРОЙКИ
======================================== */

const SEGMENT_TIME =
  30 * 60 * 1000;       // 30 минут

const HISTORY_LIFETIME =
  24 * 60 * 60 * 1000;  // 24 часа

const MIN_DISTANCE =
  10;                    // 10 метров


/* ========================================
   ВРЕМЯ ЗАПУСКА
======================================== */

const trackerStartTime =
  Date.now();


/* Последняя записанная GPS-точка */

let lastHistoryLat = null;
let lastHistoryLon = null;


/* Чтобы очистка Firebase не запускалась
   при каждой GPS-точке */

let lastCleanupTime = 0;


/* ========================================
   РАССТОЯНИЕ МЕЖДУ GPS-ТОЧКАМИ
======================================== */

function getDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* ========================================
   ТЕКУЩИЙ 30-МИНУТНЫЙ УЧАСТОК
======================================== */

function getCurrentSegment() {

  const now =
    Date.now();


  const segmentNumber =
    Math.floor(
      (now - trackerStartTime) /
      SEGMENT_TIME
    );


  const start =
    trackerStartTime +
    segmentNumber *
    SEGMENT_TIME;


  const end =
    start +
    SEGMENT_TIME;


  return {
    number: segmentNumber,
    start: start,
    end: end
  };

}


/* ========================================
   НАЗВАНИЕ УЧАСТКА
======================================== */

function formatTime(timestamp) {

  return new Date(
    timestamp
  ).toLocaleTimeString(
    [],
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function getSegmentName(segment) {

  return (
    formatTime(segment.start) +
    " - " +
    formatTime(segment.end)
  );

}


/* ========================================
   ID УЧАСТКА ДЛЯ FIREBASE
======================================== */

function getSegmentId(segment) {

  return String(
    segment.start
  );

}


/* ========================================
   УДАЛЯЕМ ИСТОРИЮ СТАРШЕ 24 ЧАСОВ
======================================== */

async function cleanupOldHistory() {

  const now =
    Date.now();


  /* Проверяем очистку примерно
     один раз в 10 минут */

  if (
    now - lastCleanupTime <
    10 * 60 * 1000
  ) {

    return;

  }


  lastCleanupTime =
    now;


  try {

    const response =
      await fetch(
        HISTORY_BASE +
        ".json?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      return;
    }


    const history =
      await response.json();


    if (!history) {
      return;
    }


    const deleteBefore =
      now -
      HISTORY_LIFETIME;


    for (
      const segmentId
      of Object.keys(history)
    ) {

      const segmentStart =
        Number(segmentId);


      if (
        !Number.isNaN(segmentStart) &&
        segmentStart < deleteBefore
      ) {

        await fetch(
          HISTORY_BASE +
          "/" +
          segmentId +
          ".json",
          {
            method: "DELETE"
          }
        );

      }

    }


  } catch (error) {

    console.log(
      "Ошибка очистки:",
      error
    );

  }

}


/* ========================================
   ОТПРАВКА GPS
======================================== */

async function sendToFirebase(
  lat,
  lon,
  accuracy,
  speed
) {

  const now =
    Date.now();


  const data = {

    latitude: lat,

    longitude: lon,

    accuracy:
      Math.round(accuracy),

    speed: speed,

    timestamp: now

  };


  try {

    /* --------------------------------
       ТЕКУЩЕЕ ПОЛОЖЕНИЕ
    -------------------------------- */

    const response =
      await fetch(
        LOCATION_URL,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Firebase: " +
        response.status
      );

    }


    /* --------------------------------
       ТЕКУЩИЙ 30-МИНУТНЫЙ УЧАСТОК
    -------------------------------- */

    const segment =
      getCurrentSegment();


    const segmentId =
      getSegmentId(segment);


    document
      .getElementById("segment")
      .textContent =
      getSegmentName(segment);


    /* --------------------------------
       НУЖНО ЛИ СОХРАНЯТЬ ТОЧКУ
    -------------------------------- */

    let saveHistory =
      false;


    if (
      lastHistoryLat === null ||
      lastHistoryLon === null
    ) {

      saveHistory =
        true;

    } else {

      const distance =
        getDistance(
          lastHistoryLat,
          lastHistoryLon,
          lat,
          lon
        );


      if (
        distance >=
        MIN_DISTANCE
      ) {

        saveHistory =
          true;

      }

    }


    /* --------------------------------
       СОХРАНЯЕМ В НУЖНЫЙ УЧАСТОК
    -------------------------------- */

    if (saveHistory) {

      const historyURL =

        HISTORY_BASE +
        "/" +
        segmentId +
        "/points.json";


      const historyResponse =
        await fetch(
          historyURL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(data)
          }
        );


      if (!historyResponse.ok) {

        throw new Error(
          "History: " +
          historyResponse.status
        );

      }


      /* Информация об участке */

      await fetch(

        HISTORY_BASE +
        "/" +
        segmentId +
        "/info.json",

        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              start:
                segment.start,

              end:
                segment.end,

              name:
                getSegmentName(
                  segment
                )

            })
        }

      );


      lastHistoryLat =
        lat;

      lastHistoryLon =
        lon;

    }


    document
      .getElementById("status")
      .textContent =
      "GPS работает • координаты отправлены";


    /* Проверяем старую историю */

    cleanupOldHistory();


  } catch (error) {

    document
      .getElementById("status")
      .textContent =

      "GPS работает • ошибка отправки: " +
      error.message;

  }

}


/* ========================================
   ПОЛУЧАЕМ GPS
======================================== */

function updatePosition(
  position
) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  let speed =
    position.coords.speed;


  if (
    speed === null ||
    speed < 0
  ) {

    speed = 0;

  } else {

    speed =
      Math.round(
        speed * 3.6
      );

  }


  document
    .getElementById("lat")
    .textContent =
    lat;


  document
    .getElementById("lon")
    .textContent =
    lon;


  document
    .getElementById("speed")
    .textContent =
    speed;


  document
    .getElementById("accuracy")
    .textContent =
    Math.round(
      accuracy
    );


  document
    .getElementById("time")
    .textContent =
    new Date()
      .toLocaleTimeString();


  document
    .getElementById("status")
    .textContent =
    "GPS работает • отправка...";


  sendToFirebase(
    lat,
    lon,
    accuracy,
    speed
  );

}


/* ========================================
   ОШИБКА GPS
======================================== */

function gpsError(error) {

  document
    .getElementById("status")
    .textContent =

    "Ошибка GPS: " +
    error.message;

}


/* ========================================
   ЗАПУСК GPS
======================================== */

if (
  "geolocation" in navigator
) {

  navigator
    .geolocation
    .watchPosition(

      updatePosition,

      gpsError,

      {
        enableHighAccuracy:
          true,

        maximumAge:
          0,

        timeout:
          20000
      }

    );

} else {

  document
    .getElementById("status")
    .textContent =
    "Браузер не поддерживает GPS";

}

</script>

</body>
</html>
