<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS автомобиля</title>
</head>

<body style="font-family:Arial; font-size:24px; padding:30px;">

<h2>GPS автомобиля</h2>

<div id="status">Ожидание GPS...</div>

<br>

<div>
  Широта: <span id="lat">---</span>
</div>

<div>
  Долгота: <span id="lon">---</span>
</div>

<div>
  Скорость: <span id="speed">---</span> км/ч
</div>

<div>
  Точность: <span id="accuracy">---</span> м
</div>

<div>
  Последнее обновление:
  <span id="time">---</span>
</div>

<script>

const FIREBASE_URL =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/location.json";

const HISTORY_URL =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/history.json";


/* Последняя точка, записанная в историю */

let lastHistoryLat = null;
let lastHistoryLon = null;


/* Расстояние между двумя GPS-точками в метрах */

function getDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const rad = Math.PI / 180;

  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* ЗАПИСЬ GPS */

async function sendToFirebase(lat, lon, accuracy, speed) {

  const data = {
    latitude: lat,
    longitude: lon,
    accuracy: Math.round(accuracy),
    speed: speed,
    timestamp: Date.now()
  };

  try {

    /* Всегда обновляем текущее положение */

    const response = await fetch(
      FIREBASE_URL,
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      throw new Error("Firebase: " + response.status);
    }


    /* Проверяем, нужно ли записывать точку в историю */

    let saveHistory = false;


    /* Первая точка */

    if (
      lastHistoryLat === null ||
      lastHistoryLon === null
    ) {

      saveHistory = true;

    } else {

      const distance = getDistance(
        lastHistoryLat,
        lastHistoryLon,
        lat,
        lon
      );


      /* Записываем только после перемещения минимум 10 метров */

      if (distance >= 10) {
        saveHistory = true;
      }

    }


    if (saveHistory) {

      const historyResponse = await fetch(
        HISTORY_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        }
      );

      if (!historyResponse.ok) {
        throw new Error(
          "History: " + historyResponse.status
        );
      }


      lastHistoryLat = lat;
      lastHistoryLon = lon;

    }


    document.getElementById("status").textContent =
      "GPS работает • координаты отправлены";


  } catch (error) {

    document.getElementById("status").textContent =
      "GPS работает • ошибка отправки: " + error.message;

  }

}


/* ПОЛУЧАЕМ GPS */

function updatePosition(position) {

  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const accuracy = position.coords.accuracy;


  /* Скорость GPS приходит в м/с */

  let speed = position.coords.speed;

  if (
    speed === null ||
    speed < 0
  ) {

    speed = 0;

  } else {

    speed = Math.round(
      speed * 3.6
    );

  }


  document.getElementById("lat").textContent =
    lat;

  document.getElementById("lon").textContent =
    lon;

  document.getElementById("speed").textContent =
    speed;

  document.getElementById("accuracy").textContent =
    Math.round(accuracy);

  document.getElementById("time").textContent =
    new Date().toLocaleTimeString();

  document.getElementById("status").textContent =
    "GPS работает • отправка...";


  sendToFirebase(
    lat,
    lon,
    accuracy,
    speed
  );

}


/* ОШИБКА GPS */

function gpsError(error) {

  document.getElementById("status").textContent =
    "Ошибка GPS: " + error.message;

}


/* ЗАПУСК GPS */

if ("geolocation" in navigator) {

  navigator.geolocation.watchPosition(
    updatePosition,
    gpsError,
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 20000
    }
  );

} else {

  document.getElementById("status").textContent =
    "Браузер не поддерживает GPS";

}

</script>

</body>
</html>
