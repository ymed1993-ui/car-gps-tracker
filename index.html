<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS автомобиля</title>
</head>

<body style="font-family:Arial; font-size:24px; padding:30px;">

<h2>GPS автомобиля</h2>

<div id="status">Ожидание GPS...</div>

<br>

<div>
  Широта: <span id="lat">---</span>
</div>

<div>
  Долгота: <span id="lon">---</span>
</div>

<div>
  Скорость: <span id="speed">---</span> км/ч
</div>

<div>
  Точность: <span id="accuracy">---</span> м
</div>

<div>
  Последнее обновление:
  <span id="time">---</span>
</div>

<script>

const FIREBASE_URL =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/location.json";

const HISTORY_URL =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/history.json";


async function sendToFirebase(lat, lon, accuracy, speed) {

  const data = {
    latitude: lat,
    longitude: lon,
    accuracy: Math.round(accuracy),
    speed: speed,
    timestamp: Date.now()
  };

  try {

    // Обновляем текущее положение автомобиля
    const response = await fetch(FIREBASE_URL, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("Firebase: " + response.status);
    }


    // Сохраняем эту точку в историю
    const historyResponse = await fetch(HISTORY_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (!historyResponse.ok) {
      throw new Error("History: " + historyResponse.status);
    }


    document.getElementById("status").textContent =
      "GPS работает • координаты отправлены";

  } catch (error) {

    document.getElementById("status").textContent =
      "GPS работает • ошибка отправки: " + error.message;

  }
}


function updatePosition(position) {

  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const accuracy = position.coords.accuracy;

  // GPS отдаёт скорость в метрах в секунду.
  // Переводим в км/ч.
  let speed = position.coords.speed;

  if (speed === null || speed < 0) {
    speed = 0;
  } else {
    speed = Math.round(speed * 3.6);
  }


  document.getElementById("lat").textContent =
    lat;

  document.getElementById("lon").textContent =
    lon;

  document.getElementById("speed").textContent =
    speed;

  document.getElementById("accuracy").textContent =
    Math.round(accuracy);

  document.getElementById("time").textContent =
    new Date().toLocaleTimeString();

  document.getElementById("status").textContent =
    "GPS работает • отправка...";


  sendToFirebase(
    lat,
    lon,
    accuracy,
    speed
  );
}


function gpsError(error) {

  document.getElementById("status").textContent =
    "Ошибка GPS: " + error.message;

}


if ("geolocation" in navigator) {

  navigator.geolocation.watchPosition(
    updatePosition,
    gpsError,
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 20000
    }
  );

} else {

  document.getElementById("status").textContent =
    "Браузер не поддерживает GPS";

}

</script>

</body>
</html>
