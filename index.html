<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS автомобиля</title>
</head>

<body style="font-family:Arial; font-size:24px; padding:30px;">

<h2>GPS автомобиля</h2>

<div id="status">Ожидание GPS...</div>

<br>

<div>Широта: <span id="lat">---</span></div>
<div>Долгота: <span id="lon">---</span></div>
<div>Скорость: <span id="speed">---</span> км/ч</div>
<div>Точность: <span id="accuracy">---</span> м</div>

<div>
  Последнее обновление:
  <span id="time">---</span>
</div>

<div>
  Участок:
  <span id="segment">---</span>
</div>

<script>

const FIREBASE_BASE =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com";

const LOCATION_URL =
  FIREBASE_BASE + "/location.json";

const HISTORY_BASE =
  FIREBASE_BASE + "/history";


/* =========================
   НАСТРОЙКИ
========================= */

const HISTORY_LIFETIME =
  24 * 60 * 60 * 1000;

const MIN_DISTANCE = 10;


/* Последняя сохранённая точка */

let lastHistoryLat = null;
let lastHistoryLon = null;


/* Текущий участок */

let lastSegmentId = null;


/* Последняя очистка */

let lastCleanupTime = 0;


/* =========================
   РАССТОЯНИЕ
========================= */

function getDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;
  const rad = Math.PI / 180;

  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* =========================
   ФИКСИРОВАННЫЙ УЧАСТОК
   01:00-01:30
   01:30-02:00
   02:00-02:30
========================= */

function getCurrentSegment() {

  const now = new Date();

  const start = new Date(now);

  start.setSeconds(0);
  start.setMilliseconds(0);

  if (now.getMinutes() < 30) {

    start.setMinutes(0);

  } else {

    start.setMinutes(30);

  }


  const end =
    new Date(
      start.getTime() +
      30 * 60 * 1000
    );


  return {
    start: start.getTime(),
    end: end.getTime()
  };
}


/* =========================
   ФОРМАТ ВРЕМЕНИ
========================= */

function formatTime(timestamp) {

  const date =
    new Date(timestamp);

  return String(
    date.getHours()
  ).padStart(2, "0") +
    ":" +
    String(
      date.getMinutes()
    ).padStart(2, "0");
}


function getSegmentName(segment) {

  return (
    formatTime(segment.start) +
    " - " +
    formatTime(segment.end)
  );
}


function getSegmentId(segment) {

  return String(segment.start);
}


/* =========================
   УДАЛЕНИЕ ИСТОРИИ
   СТАРШЕ 24 ЧАСОВ
========================= */

async function cleanupOldHistory() {

  const now = Date.now();


  /* Проверяем раз в 10 минут */

  if (
    now - lastCleanupTime <
    10 * 60 * 1000
  ) {
    return;
  }


  lastCleanupTime = now;


  try {

    const response =
      await fetch(
        HISTORY_BASE +
        ".json?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      return;
    }


    const history =
      await response.json();


    if (!history) {
      return;
    }


    const deleteBefore =
      now - HISTORY_LIFETIME;


    for (
      const segmentId
      of Object.keys(history)
    ) {

      const segment =
        history[segmentId];


      let segmentEnd = 0;


      if (
        segment &&
        segment.info &&
        typeof segment.info.end === "number"
      ) {

        segmentEnd =
          segment.info.end;

      } else {

        const start =
          Number(segmentId);

        if (!Number.isNaN(start)) {

          segmentEnd =
            start +
            30 * 60 * 1000;

        }

      }


      if (
        segmentEnd > 0 &&
        segmentEnd < deleteBefore
      ) {

        await fetch(
          HISTORY_BASE +
          "/" +
          segmentId +
          ".json",
          {
            method: "DELETE"
          }
        );

      }

    }


  } catch (error) {

    console.log(
      "Ошибка очистки:",
      error
    );

  }
}


/* =========================
   ОТПРАВКА В FIREBASE
========================= */

async function sendToFirebase(
  lat,
  lon,
  accuracy,
  speed
) {

  const now =
    Date.now();


  const data = {

    latitude: lat,
    longitude: lon,
    accuracy: Math.round(accuracy),
    speed: speed,
    timestamp: now

  };


  try {

    /* ТЕКУЩЕЕ ПОЛОЖЕНИЕ */

    const response =
      await fetch(
        LOCATION_URL,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (!response.ok) {

      throw new Error(
        "Firebase: " +
        response.status
      );

    }


    /* =========================
       ОПРЕДЕЛЯЕМ УЧАСТОК
    ========================= */

    const segment =
      getCurrentSegment();


    const segmentId =
      getSegmentId(segment);


    document
      .getElementById("segment")
      .textContent =
      getSegmentName(segment);


    /* =========================
       НАЧАЛСЯ НОВЫЙ УЧАСТОК
    ========================= */

    if (
      lastSegmentId !== segmentId
    ) {

      lastSegmentId =
        segmentId;

      /*
        Разрешаем первой точке
        нового участка сохраниться
      */

      lastHistoryLat = null;
      lastHistoryLon = null;

    }


    /* =========================
       ПРОВЕРКА РАССТОЯНИЯ
    ========================= */

    let saveHistory = false;


    if (
      lastHistoryLat === null ||
      lastHistoryLon === null
    ) {

      saveHistory = true;

    } else {

      const distance =
        getDistance(
          lastHistoryLat,
          lastHistoryLon,
          lat,
          lon
        );


      if (
        distance >= MIN_DISTANCE
      ) {

        saveHistory = true;

      }

    }


    /* =========================
       СОХРАНЯЕМ ТОЧКУ
    ========================= */

    if (saveHistory) {

      /* Сначала создаём INFO */

      const infoResponse =
        await fetch(

          HISTORY_BASE +
          "/" +
          segmentId +
          "/info.json",

          {
            method: "PUT",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                start:
                  segment.start,

                end:
                  segment.end,

                name:
                  getSegmentName(
                    segment
                  )

              })
          }

        );


      if (!infoResponse.ok) {

        throw new Error(
          "Info: " +
          infoResponse.status
        );

      }


      /* Потом GPS-точку */

      const historyResponse =
        await fetch(

          HISTORY_BASE +
          "/" +
          segmentId +
          "/points.json",

          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(data)
          }

        );


      if (!historyResponse.ok) {

        throw new Error(
          "History: " +
          historyResponse.status
        );

      }


      lastHistoryLat = lat;
      lastHistoryLon = lon;

    }


    document
      .getElementById("status")
      .textContent =
      "GPS работает • координаты отправлены";


    cleanupOldHistory();


  } catch (error) {

    document
      .getElementById("status")
      .textContent =
      "GPS работает • ошибка отправки: " +
      error.message;

  }

}


/* =========================
   GPS
========================= */

function updatePosition(position) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  let speed =
    position.coords.speed;


  if (
    speed === null ||
    speed < 0
  ) {

    speed = 0;

  } else {

    speed =
      Math.round(
        speed * 3.6
      );

  }


  document
    .getElementById("lat")
    .textContent = lat;


  document
    .getElementById("lon")
    .textContent = lon;


  document
    .getElementById("speed")
    .textContent = speed;


  document
    .getElementById("accuracy")
    .textContent =
    Math.round(accuracy);


  document
    .getElementById("time")
    .textContent =
    new Date()
      .toLocaleTimeString();


  document
    .getElementById("status")
    .textContent =
    "GPS работает • отправка...";


  sendToFirebase(
    lat,
    lon,
    accuracy,
    speed
  );

}


/* =========================
   ОШИБКА GPS
========================= */

function gpsError(error) {

  document
    .getElementById("status")
    .textContent =
    "Ошибка GPS: " +
    error.message;

}


/* =========================
   ЗАПУСК
========================= */

if ("geolocation" in navigator) {

  navigator.geolocation.watchPosition(

    updatePosition,

    gpsError,

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 20000
    }

  );

} else {

  document
    .getElementById("status")
    .textContent =
    "Браузер не поддерживает GPS";

}

</script>

</body>
</html>
