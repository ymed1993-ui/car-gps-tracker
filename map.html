<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GPS автомобиля</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #info {
      padding: 10px 15px;
      font-size: 18px;
      background: white;
    }

    #status {
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: calc(100vh - 120px);
    }
  </style>
</head>

<body>

<div id="info">
  <b>GPS автомобиля</b><br>

  Статус:
  <span id="status">Ожидание...</span><br>

  Скорость:
  <span id="speed">---</span> км/ч<br>

  Точность:
  <span id="accuracy">---</span> м<br>

  Обновлено:
  <span id="time">---</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const URL =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/location.json";

const map = L.map("map").setView([38.54645, 68.91205], 16);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

const marker = L.marker([38.54645, 68.91205]).addTo(map);

let first = true;
let animation;


/* ПЛАВНОЕ ДВИЖЕНИЕ */

function moveMarker(lat, lon) {

  if (animation) {
    cancelAnimationFrame(animation);
  }

  const start = marker.getLatLng();

  const startTime = performance.now();

  function move(now) {

    const p =
      Math.min((now - startTime) / 2800, 1);

    const newLat =
      start.lat + (lat - start.lat) * p;

    const newLon =
      start.lng + (lon - start.lng) * p;

    marker.setLatLng([newLat, newLon]);

    if (p < 1) {
      animation = requestAnimationFrame(move);
    }
  }

  animation = requestAnimationFrame(move);
}


/* СТАТУС */

function status(text, color) {

  const el = document.getElementById("status");

  el.textContent = text;
  el.style.color = color;
}


/* FIREBASE */

async function updateCar() {

  try {

    const response =
      await fetch(URL + "?t=" + Date.now());

    const data =
      await response.json();

    if (!data) return;

    const lat = data.latitude;
    const lon = data.longitude;

    moveMarker(lat, lon);

    if (first) {

      marker.setLatLng([lat, lon]);

      map.setView([lat, lon], 17);

      first = false;
    }

    document.getElementById("speed").textContent =
      data.speed ?? "---";

    document.getElementById("accuracy").textContent =
      data.accuracy ?? "---";

    if (data.timestamp) {

      const age =
        Date.now() - data.timestamp;

      if (age <= 30000) {
        status("Автомобиль онлайн", "green");
      } else {
        status("Автомобиль офлайн", "red");
      }

      document.getElementById("time").textContent =
        new Date(data.timestamp).toLocaleTimeString();
    }

  } catch (e) {

    status("Ошибка подключения", "red");
  }
}


updateCar();

setInterval(updateCar, 3000);

</script>

</body>
</html>
