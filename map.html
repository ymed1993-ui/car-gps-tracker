<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Карта автомобиля</title>


  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      font-family:
        Arial,
        sans-serif;
    }


    #info {

      padding:
        10px 15px;

      font-size:
        18px;

      box-sizing:
        border-box;

      background:
        white;
    }


    #buttons {

      margin-top:
        8px;
    }


    button {

      font-size:
        16px;

      padding:
        7px 12px;

      margin:
        3px;

      cursor:
        pointer;
    }


    #segments {

      margin-top:
        8px;
    }


    #segments button {

      background:
        #f2f2f2;

      border:
        1px solid #999;

      border-radius:
        4px;
    }


    #map {

      width:
        100%;

      height:
        calc(100vh - 220px);

      min-height:
        400px;
    }

  </style>

</head>


<body>


<div id="info">


  <b>
    GPS автомобиля
  </b>

  <br>


  Статус:

  <span id="status">
    Ожидание данных...
  </span>

  <br>


  Скорость:

  <span id="speed">
    ---
  </span>

  км/ч

  <br>


  Точность:

  <span id="accuracy">
    ---
  </span>

  м

  <br>


  Обновлено:

  <span id="time">
    ---
  </span>


  <div id="buttons">


    <button
      onclick="loadSegments()"
    >

      История

    </button>


    <button
      onclick="hideHistory()"
    >

      Скрыть

    </button>


  </div>


  <div id="segments">
  </div>


</div>



<div id="map">
</div>



<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<script>


/* =========================================================
   FIREBASE
========================================================= */


const FIREBASE_BASE =

  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com";


const FIREBASE_URL =

  FIREBASE_BASE +
  "/location.json";


const HISTORY_URL =

  FIREBASE_BASE +
  "/history.json";



/* =========================================================
   КАРТА
========================================================= */


const map =

  L.map(
    "map"
  )
  .setView(

    [
      38.54645,
      68.91205
    ],

    16

  );



L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:
      19,

    attribution:
      "© OpenStreetMap"

  }

).addTo(
  map
);



/* =========================================================
   МАРКЕР АВТОМОБИЛЯ
========================================================= */


const marker =

  L.marker(

    [
      38.54645,
      68.91205
    ]

  )
  .addTo(
    map
  );



/* =========================================================
   ЛИНИЯ ИСТОРИИ
========================================================= */


const routeLine =

  L.polyline(

    [],

    {

      color:
        "blue",

      weight:
        5,

      opacity:
        0.8

    }

  );



let firstUpdate =
  true;



/* =========================================================
   ВРЕМЯ ТАДЖИКИСТАНА
========================================================= */


function formatTime(
  timestamp
) {


  return new Date(

    Number(
      timestamp
    )

  )
  .toLocaleTimeString(

    "ru-RU",

    {

      timeZone:
        "Asia/Dushanbe",

      hour:
        "2-digit",

      minute:
        "2-digit",

      hour12:
        false

    }

  );

}



/* =========================================================
   НАЗВАНИЕ 30-МИНУТНОГО УЧАСТКА
========================================================= */


function formatSegmentName(
  start,
  end
) {


  return (

    formatTime(
      start
    )

    +

    " - "

    +

    formatTime(
      end
    )

  );

}



/* =========================================================
   ЗАГРУЗКА СПИСКА ИСТОРИИ
========================================================= */


async function loadSegments() {


  const container =

    document.getElementById(
      "segments"
    );


  container.innerHTML =

    "Загрузка истории...";


  try {


    const response =

      await fetch(

        HISTORY_URL +

        "?t=" +

        Date.now(),

        {

          cache:
            "no-store"

        }

      );



    if (
      !response.ok
    ) {


      container.innerHTML =

        "Ошибка загрузки";


      return;

    }



    const history =

      await response.json();



    if (
      !history
    ) {


      container.innerHTML =

        "История пока пустая";


      return;

    }



    const segments =
      [];



    for (

      const [
        segmentId,
        segment
      ]

      of Object.entries(
        history
      )

    ) {


      if (

        segment &&

        segment.info &&

        segment.points

      ) {


        segments.push(

          {

            id:
              segmentId,

            info:
              segment.info,

            points:
              segment.points

          }

        );

      }

    }



    if (
      segments.length === 0
    ) {


      container.innerHTML =

        "Новых участков пока нет";


      return;

    }



    /* Самые новые участки сверху */


    segments.sort(

      (
        a,
        b
      ) =>

        Number(
          b.info.start
        )

        -

        Number(
          a.info.start
        )

    );



    container.innerHTML =
      "";



    for (
      const segment
      of segments
    ) {


      const button =

        document.createElement(
          "button"
        );



      /*
       * ВАЖНО:
       *
       * Старое segment.info.name
       * НЕ используем.
       *
       * Название всегда рассчитываем
       * из timestamp по часовому поясу
       * Душанбе.
       */


      button.textContent =

        formatSegmentName(

          segment.info.start,

          segment.info.end

        );



      button.onclick =

        function () {


          showSegment(

            segment.points,

            button

          );

        };



      container.appendChild(
        button
      );

    }



  } catch (
    error
  ) {


    container.innerHTML =

      "Ошибка загрузки истории";


    console.log(
      error
    );

  }

}



/* =========================================================
   ПОКАЗАТЬ ВЫБРАННЫЙ УЧАСТОК
========================================================= */


function showSegment(

  pointsObject,

  selectedButton

) {


  if (
    !pointsObject
  ) {

    return;

  }



  const data =

    Object.values(
      pointsObject
    )


    .filter(

      item =>


        item &&


        typeof item.latitude ===
          "number" &&


        typeof item.longitude ===
          "number" &&


        typeof item.timestamp ===
          "number" &&


        (

          typeof item.accuracy !==
            "number"

          ||

          item.accuracy <=
            50

        )

    )


    .sort(

      (
        a,
        b
      ) =>

        a.timestamp -
        b.timestamp

    );



  const points =
    [];


  let previousPoint =
    null;



  for (
    const item
    of data
  ) {


    const currentPoint =

      L.latLng(

        item.latitude,

        item.longitude

      );



    if (
      previousPoint
    ) {


      const distance =

        previousPoint.distanceTo(
          currentPoint
        );



      /*
       * Убираем сильные
       * ошибочные скачки GPS.
       */


      if (
        distance > 300
      ) {

        continue;

      }

    }



    points.push(

      [

        item.latitude,

        item.longitude

      ]

    );



    previousPoint =
      currentPoint;

  }



  if (
    points.length === 0
  ) {


    alert(

      "В этом участке нет точек маршрута"

    );


    return;

  }



  routeLine.setLatLngs(
    points
  );



  if (
    !map.hasLayer(
      routeLine
    )
  ) {


    routeLine.addTo(
      map
    );

  }



  /* Выделяем выбранную кнопку */


  const buttons =

    document.querySelectorAll(

      "#segments button"

    );



  buttons.forEach(

    button => {


      button.style.fontWeight =

        "normal";

    }

  );



  if (
    selectedButton
  ) {


    selectedButton.style.fontWeight =

      "bold";

  }



  /* Показываем весь маршрут */


  if (
    points.length >= 2
  ) {


    map.fitBounds(

      routeLine.getBounds(),

      {

        padding:
          [30, 30]

      }

    );


  } else {


    map.setView(

      points[0],

      17

    );

  }

}



/* =========================================================
   СКРЫТЬ ИСТОРИЮ
========================================================= */


function hideHistory() {


  if (

    map.hasLayer(
      routeLine
    )

  ) {


    map.removeLayer(
      routeLine
    );

  }



  document
    .getElementById(
      "segments"
    )
    .innerHTML =
    "";

}



/* =========================================================
   ТЕКУЩАЯ ПОЗИЦИЯ
========================================================= */


async function updateCar() {


  try {


    const response =

      await fetch(

        FIREBASE_URL +

        "?t=" +

        Date.now(),

        {

          cache:
            "no-store"

        }

      );



    if (
      !response.ok
    ) {


      throw new Error(
        "Firebase error"
      );

    }



    const data =

      await response.json();



    if (

      !data ||

      typeof data.latitude !==
        "number" ||

      typeof data.longitude !==
        "number"

    ) {


      document
        .getElementById(
          "status"
        )
        .textContent =

        "Нет данных";


      return;

    }



    const lat =
      data.latitude;


    const lon =
      data.longitude;



    /* =====================================================
       МАРКЕР
    ===================================================== */


    marker.setLatLng(

      [
        lat,
        lon
      ]

    );



    /* =====================================================
       ПЕРВЫЙ ЗАПУСК
    ===================================================== */


    if (
      firstUpdate
    ) {


      map.setView(

        [
          lat,
          lon
        ],

        17

      );


      firstUpdate =
        false;

    }



    /* =====================================================
       СКОРОСТЬ
    ===================================================== */


    if (

      typeof data.speed ===
      "number"

    ) {


      document
        .getElementById(
          "speed"
        )
        .textContent =

        Math.round(
          data.speed
        );


    } else {


      document
        .getElementById(
          "speed"
        )
        .textContent =

        "---";

    }



    /* =====================================================
       ТОЧНОСТЬ
    ===================================================== */


    document
      .getElementById(
        "accuracy"
      )
      .textContent =

      data.accuracy ??
      "---";



    /* =====================================================
       ОНЛАЙН / ОФЛАЙН
    ===================================================== */


    if (
      data.timestamp
    ) {


      const age =

        Date.now() -

        data.timestamp;



      if (
        age <= 30000
      ) {


        document
          .getElementById(
            "status"
          )
          .textContent =

          "Автомобиль онлайн";


      } else {


        document
          .getElementById(
            "status"
          )
          .textContent =

          "Автомобиль офлайн";

      }



      /*
       * Время последней точки
       * тоже показываем
       * по Душанбе.
       */


      document
        .getElementById(
          "time"
        )
        .textContent =

        new Date(
          Number(
            data.timestamp
          )
        )
        .toLocaleTimeString(

          "ru-RU",

          {

            timeZone:
              "Asia/Dushanbe",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hour12:
              false

          }

        );


    } else {


      document
        .getElementById(
          "status"
        )
        .textContent =

        "Автомобиль офлайн";


      document
        .getElementById(
          "time"
        )
        .textContent =

        "---";

    }



  } catch (
    error
  ) {


    document
      .getElementById(
        "status"
      )
      .textContent =

      "Ошибка подключения";

  }

}



/* =========================================================
   ЗАПУСК
========================================================= */


updateCar();



setInterval(

  updateCar,

  3000

);


</script>


</body>

</html>
