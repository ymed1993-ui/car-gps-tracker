<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Карта автомобиля</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #info {
      padding: 12px 15px;
      font-size: 18px;
      box-sizing: border-box;
      background: white;
    }

    #map {
      width: 100%;
      height: calc(100vh - 105px);
    }
  </style>
</head>

<body>

<div id="info">
  <b>GPS автомобиля</b><br>
  Статус: <span id="status">Ожидание данных...</span><br>
  Точность: <span id="accuracy">---</span> м<br>
  Обновлено: <span id="time">---</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const FIREBASE_URL =
  "https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/location.json";

const map = L.map("map").setView(
  [38.54645, 68.91205],
  16
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

const marker = L.marker(
  [38.54645, 68.91205]
).addTo(map);

let firstUpdate = true;

async function updateCar() {

  try {

    const response = await fetch(
      FIREBASE_URL + "?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("Firebase error");
    }

    const data = await response.json();

    if (
      !data ||
      typeof data.latitude !== "number" ||
      typeof data.longitude !== "number"
    ) {
      document.getElementById("status").textContent =
        "Нет данных";
      return;
    }

    const lat = data.latitude;
    const lon = data.longitude;

    marker.setLatLng([lat, lon]);

    if (firstUpdate) {

      map.setView(
        [lat, lon],
        17
      );

      firstUpdate = false;

    } else {

      map.panTo(
        [lat, lon],
        {
          animate: true,
          duration: 1
        }
      );

    }

    document.getElementById("accuracy").textContent =
      data.accuracy ?? "---";

    document.getElementById("status").textContent =
      "Автомобиль онлайн";

    if (data.timestamp) {

      document.getElementById("time").textContent =
        new Date(data.timestamp).toLocaleTimeString();

    } else {

      document.getElementById("time").textContent =
        new Date().toLocaleTimeString();

    }

  } catch (error) {

    document.getElementById("status").textContent =
      "Ошибка подключения";

  }
}

updateCar();

/* Проверяем новые координаты каждые 3 секунды */
setInterval(updateCar, 3000);

</script>

</body>
</html>
