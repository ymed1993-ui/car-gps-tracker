<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS автомобиля</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{margin:0;height:100%;font-family:Arial}
#info{padding:10px 15px;font-size:18px}
#status{font-weight:bold}
#map{height:calc(100vh - 120px)}
</style>
</head>

<body>

<div id="info">
<b>GPS автомобиля</b><br>
Статус: <span id="status">Ожидание...</span><br>
Скорость: <span id="speed">---</span> км/ч<br>
Точность: <span id="accuracy">---</span> м<br>
Обновлено: <span id="time">---</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const url="https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com/location.json";

const map=L.map("map").setView([38.54645,68.91205],16);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:19}
).addTo(map);

const marker=L.marker([38.54645,68.91205]).addTo(map);

let first=true;
let animation;

function move(lat,lon){

  if(animation) cancelAnimationFrame(animation);

  const start=marker.getLatLng();
  const time=performance.now();

  function step(now){

    const p=Math.min((now-time)/1800,1);

    marker.setLatLng([
      start.lat+(lat-start.lat)*p,
      start.lng+(lon-start.lng)*p
    ]);

    if(p<1)
      animation=requestAnimationFrame(step);
  }

  animation=requestAnimationFrame(step);
}

function status(text,color){
  const s=document.getElementById("status");
  s.textContent=text;
  s.style.color=color;
}

async function update(){

  try{

    const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
    const d=await r.json();

    if(!d) return;

    const online=
      d.online === true &&
      Date.now()-d.timestamp < 5000;

    status(
      online ? "Автомобиль онлайн" : "Автомобиль офлайн",
      online ? "green" : "red"
    );

    if(first){
      marker.setLatLng([d.latitude,d.longitude]);
      map.setView([d.latitude,d.longitude],17);
      first=false;
    }else{
      move(d.latitude,d.longitude);
    }

    speed.textContent=d.speed ?? "---";
    accuracy.textContent=d.accuracy ?? "---";

    if(d.timestamp)
      time.textContent=new Date(d.timestamp).toLocaleTimeString();

  }catch(e){
    status("Ошибка подключения","red");
  }
}

update();
setInterval(update,2000);

</script>
</body>
</html>
