<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS автомобиля</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{margin:0;height:100%;font-family:Arial}
#info{padding:10px 15px;font-size:18px}
#status{font-weight:bold}
button{margin:5px 5px 0 0;padding:7px 12px;font-size:15px}
#segments{margin-top:5px}
#map{height:calc(100vh - 170px)}
</style>
</head>

<body>

<div id="info">
<b>GPS автомобиля</b><br>

Статус: <span id="status">Ожидание...</span><br>
Скорость: <span id="speed">---</span> км/ч<br>
Точность: <span id="accuracy">---</span> м<br>
Обновлено: <span id="time">---</span><br>

<button onclick="historyLoad()">История</button>
<button onclick="historyHide()">Скрыть</button>

<div id="segments"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const base=
"https://car-gps-tracker-66c4b-default-rtdb.firebaseio.com";

const map=L.map("map")
.setView([38.54645,68.91205],16);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:19}
).addTo(map);

const marker=
L.marker([38.54645,68.91205])
.addTo(map);

let first=true;
let animation=null;
let route=null;
let startMark=null;
let endMark=null;


/* ВРЕМЯ ДУШАНБЕ */

function time(t){
 return new Date(t).toLocaleTimeString(
  "ru-RU",
  {
   timeZone:"Asia/Dushanbe",
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}

function fullTime(t){
 return new Date(t).toLocaleTimeString(
  "ru-RU",
  {
   timeZone:"Asia/Dushanbe",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit"
  }
 );
}

function day(t){
 return new Date(t).toLocaleDateString(
  "en-CA",
  {timeZone:"Asia/Dushanbe"}
 );
}


/* ДВИЖЕНИЕ МАРКЕРА */

function move(lat,lon){

 if(animation)
  cancelAnimationFrame(animation);

 const s=marker.getLatLng();
 const start=performance.now();

 function step(n){

  const p=Math.min(
   (n-start)/1800,
   1
  );

  marker.setLatLng([
   s.lat+(lat-s.lat)*p,
   s.lng+(lon-s.lng)*p
  ]);

  if(p<1)
   animation=requestAnimationFrame(step);
 }

 animation=requestAnimationFrame(step);
}


/* ТЕКУЩАЯ ПОЗИЦИЯ */

async function update(){

 try{

  const r=await fetch(
   base+"/location.json?t="+Date.now(),
   {cache:"no-store"}
  );

  const d=await r.json();

  if(!d)return;

  const online=
   d.online===true &&
   Date.now()-d.timestamp<5000;

  const status=
   document.getElementById("status");

  status.textContent=
   online
   ?"Автомобиль онлайн"
   :"Автомобиль офлайн";

  status.style.color=
   online?"green":"red";

  if(first){

   marker.setLatLng([
    d.latitude,
    d.longitude
   ]);

   map.setView([
    d.latitude,
    d.longitude
   ],17);

   first=false;

  }else{

   move(
    d.latitude,
    d.longitude
   );
  }

  document.getElementById("speed")
   .textContent=d.speed??"---";

  document.getElementById("accuracy")
   .textContent=d.accuracy??"---";

  if(d.timestamp){
   document.getElementById("time")
    .textContent=fullTime(d.timestamp);
  }

 }catch(e){}
}


/* ИСТОРИЯ */

async function historyLoad(){

 const box=
  document.getElementById("segments");

 box.textContent="Загрузка...";

 try{

  const r=await fetch(
   base+"/history.json?t="+Date.now(),
   {cache:"no-store"}
  );

  const data=await r.json();

  box.innerHTML="";

  if(!data){
   box.textContent="Истории пока нет";
   return;
  }

  const today=day(Date.now());

  const all=
   Object.keys(data)
   .filter(id=>/^\d+$/.test(id));

  /* Удаляем старые дни */

  for(const id of all){

   if(day(Number(id))!==today){

    fetch(
     base+"/history/"+id+".json",
     {method:"DELETE"}
    );
   }
  }

  const ids=
   all
   .filter(
    id=>day(Number(id))===today
   )
   .sort(
    (a,b)=>Number(a)-Number(b)
   );

  if(!ids.length){
   box.textContent="Истории сегодня нет";
   return;
  }

  ids.forEach(id=>{

   const start=Number(id);

   const b=
    document.createElement("button");

   b.textContent=
    time(start)+
    "–"+
    time(start+1800000);

   b.onclick=
    ()=>showRoute(id);

   box.appendChild(b);
  });

 }catch(e){

  box.textContent="Ошибка истории";
 }
}


/* ПОКАЗАТЬ МАРШРУТ */

async function showRoute(id){

 try{

  const r=await fetch(
   base+
   "/history/"+
   id+
   "/points.json?t="+
   Date.now(),

   {cache:"no-store"}
  );

  const data=await r.json();

  if(!data)return;

  const points=
   Object.values(data)

   .filter(
    p=>
     p.latitude!=null &&
     p.longitude!=null
   )

   .sort(
    (a,b)=>
     a.timestamp-b.timestamp
   )

   .map(
    p=>[
     p.latitude,
     p.longitude
    ]
   );

  clearRoute();

  if(!points.length)return;

  route=
   L.polyline(
    points,
    {
     color:"blue",
     weight:5
    }
   ).addTo(map);

  startMark=
   L.circleMarker(
    points[0],
    {
     radius:9,
     color:"green",
     fillColor:"green",
     fillOpacity:1
    }
   )
   .addTo(map)
   .bindPopup("Начало");

  endMark=
   L.circleMarker(
    points[points.length-1],
    {
     radius:9,
     color:"red",
     fillColor:"red",
     fillOpacity:1
    }
   )
   .addTo(map)
   .bindPopup("Конец");

  if(points.length>1){

   map.fitBounds(
    route.getBounds(),
    {padding:[30,30]}
   );

  }else{

   map.setView(
    points[0],
    17
   );
  }

 }catch(e){}
}


/* УБРАТЬ МАРШРУТ */

function clearRoute(){

 if(route){
  map.removeLayer(route);
  route=null;
 }

 if(startMark){
  map.removeLayer(startMark);
  startMark=null;
 }

 if(endMark){
  map.removeLayer(endMark);
  endMark=null;
 }
}


/* СКРЫТЬ ИСТОРИЮ */

function historyHide(){

 document.getElementById(
  "segments"
 ).innerHTML="";

 clearRoute();
}


/* ЗАПУСК */

update();

setInterval(
 update,
 2000
);

</script>

</body>
</html>
